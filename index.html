	ma[jackpot[4]]="1"

	{
		if (parseInt(Notjackpot[i])==0)
		{
			j=parseInt(i)%10;
			unjackpot=unjackpot+j;
		}
	}
	
	for ( i=0 ; i<=unjackpot.length-1 ; i++ )
	{
		if ( i != 1)
		{
			ma[unjackpot.charAt(i)]="1";
